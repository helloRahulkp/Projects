# =============================================================================
# docker-compose.yml — AI Currency Detection & Voice Assistant System v2.0
#
# Usage:
#   docker compose up --build          # Start all services
#   docker compose up --build -d       # Start in background
#   docker compose logs -f backend     # Follow backend logs
#   docker compose down                # Stop all services
#
# Access:
#   App (via Nginx):  http://localhost
#   Frontend direct:  http://localhost:8501
#   Backend API:      http://localhost:8000
#   API Docs:         http://localhost:8000/docs
# =============================================================================

services:

  # ── Backend: FastAPI + YOLOv8 ─────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: currency_backend
    restart: unless-stopped
    environment:
      - DEVICE=cpu
      - LOG_LEVEL=INFO
      - MODEL_PATH=models/checkpoints/best.pt
      - PYTHONPATH=/app
    volumes:
      - ./models/checkpoints:/app/models/checkpoints:ro
      - ./outputs:/app/outputs
    ports:
      - "8000:8000"
    networks:
      - currency_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/ping"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  # ── Frontend: Streamlit Dashboard ─────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: currency_frontend
    restart: unless-stopped
    environment:
      - API_URL=http://backend:8000
      - PYTHONPATH=/app
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - currency_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: currency_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - currency_net

networks:
  currency_net:
    name: currency_network
    driver: bridge

volumes:
  outputs:
    driver: local
