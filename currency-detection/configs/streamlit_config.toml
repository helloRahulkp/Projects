[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50

[theme]
base = "dark"
primaryColor = "#667eea"
backgroundColor = "#0f0f1a"
secondaryBackgroundColor = "#1a1a2e"
textColor = "#e0e0e0"
font = "sans serif"

[browser]
gatherUsageStats = false

[runner]
fastReruns = true
